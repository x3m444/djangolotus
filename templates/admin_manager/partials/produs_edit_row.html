<tr id="produs-{{ produs.pk }}">
    <td class="text-muted small">{{ produs.pk }}</td>
    <td>
        <input type="text" name="nume" value="{{ produs.nume }}"
               class="form-control form-control-sm" id="edit-nume-{{ produs.pk }}" required>
    </td>
    <td>
        <select name="categorie" class="form-select form-select-sm" id="edit-cat-{{ produs.pk }}">
            {% for cod, label in categorii %}
            <option value="{{ cod }}" {% if produs.categorie == cod %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
        </select>
    </td>
    <td>
        <input type="number" name="pret_standard"
               value="{{ produs.pret_standard|default:'' }}"
               class="form-control form-control-sm" min="0" step="0.5"
               id="edit-pret-{{ produs.pk }}">
    </td>
    <td class="text-end">
        <button class="btn btn-sm btn-success"
                hx-post="{% url 'manager:produs_edit' produs.pk %}"
                hx-target="#produs-{{ produs.pk }}"
                hx-swap="outerHTML"
                hx-include="#edit-nume-{{ produs.pk }}, #edit-cat-{{ produs.pk }}, #edit-pret-{{ produs.pk }}"
                hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
            <i class="bi bi-check-lg"></i>
        </button>
        <button class="btn btn-sm btn-outline-secondary"
                hx-get="{% url 'manager:produs_edit' produs.pk %}"
                hx-target="#produs-{{ produs.pk }}"
                hx-swap="outerHTML">
            <i class="bi bi-x-lg"></i>
        </button>
    </td>
</tr>

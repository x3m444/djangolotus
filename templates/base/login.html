<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Lotus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #1a1a2e; display: flex; align-items: center; min-height: 100vh; }
        .login-card { border-radius: 1rem; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-8 col-md-5 col-lg-4">
                <div class="card login-card">
                    <div class="card-body p-4">
                        <h4 class="text-center mb-4 fw-bold">🍽 Lotus</h4>

                        {% if messages %}
                            {% for message in messages %}
                            <div class="alert alert-danger py-2 small">{{ message }}</div>
                            {% endfor %}
                        {% endif %}

                        <form method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Username</label>
                                <input type="text" name="username" class="form-control" autofocus required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label small fw-semibold">Parolă</label>
                                <input type="password" name="password" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-dark w-100">Intră</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
